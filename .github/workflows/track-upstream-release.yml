name: Track latest upstream release
on:
  schedule: [{ cron: "0 6 * * *" }]   # täglich 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod   # dieser Branch wird angepasst

      - name: Ensure tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get latest upstream release tag
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/opensource-socialnetwork/opensource-socialnetwork/releases/latest | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Konnte Release-Tag nicht ermitteln"; exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Latest tag: $TAG"

      - name: Reset prod to upstream tag and push
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git remote add upstream https://github.com/opensource-socialnetwork/opensource-socialnetwork.git || true
          git fetch --tags upstream
          git reset --hard "refs/tags/${TAG}"
          git push origin HEAD:prod --force
